<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Admin Access | ADEEL ART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-root" id="adminRoot">
      <section class="login-wrap" id="loginView">
        <form class="login-panel" id="loginForm">
          <img src="adeel-art-logo.svg" alt="ADEEL ART DRAWINGS" />
          <span class="eyebrow">Private workspace</span>
          <h1>Admin sign in</h1>
          <p>Enter your administrator password to continue.</p>
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" autocomplete="current-password" required />
          <p class="form-error" id="loginError" role="alert" hidden></p>
          <button class="button primary full" type="submit">Unlock dashboard</button>
        </form>
      </section>
      <div id="dashboardMount"></div>
      <div class="toast" id="adminToast" role="status"></div>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
